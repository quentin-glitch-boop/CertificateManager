name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Test import
        run: python -c "import sys; sys.path.insert(0, '.'); from app import app; print('Import successful')"
          
      - name: Run single test
        run: python -m pytest tests/test_app_startup.py::test_app_creation -v
          
      - name: Run all app startup tests
        run: python -m pytest tests/test_app_startup.py -v
