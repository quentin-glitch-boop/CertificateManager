version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE=${DATABASE:-/app/documents.db}
      - UPLOAD_FOLDER=${UPLOAD_FOLDER:-/app/static/uploads}
    volumes:
      - .:/app
    ports:
      - "${APP_PORT:-5000}:8000"
    entrypoint: /app/entrypoint.sh
    command: gunicorn --bind 0.0.0.0:8000 --workers 2 --timeout 120 --reload app:app
    restart: unless-stopped

  db:
    image: alpine:latest
    volumes:
      - sqlite_data:/var/lib/sqlite
    command: tail -f /dev/null

volumes:
  sqlite_data:
