version: '3.8'

services:
  app:
    volumes:
      - ../data/prod:/app/static/uploads
      - ../data/prod:/app
    command: >
      gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 120 app:app
    environment:
      - FLASK_ENV=production
    ports:
      - "8000:8000"
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    restart: always

  db:
    volumes:
      - ../data/prod:/var/lib/sqlite
